<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="600" height="500"
     viewBox="0 0 600 500">

    <!-- Rectangle -->
    <rect x="10" y="10" width="100" height="60"/>

    <!-- Rectangle à coins arrondis -->
    <rect x="130" y="10" width="100" height="60"
          rx="10" ry="10"/>

    <!-- Cercle -->
    <circle cx="290" cy="40" r="30"/>

    <!-- Ellipse -->
    <ellipse cx="400" cy="40" rx="60" ry="30"/>

    <!-- Ligne -->
    <line x1="10" y1="100" x2="110" y2="150"/>

    <!-- Polyligne ouverte -->
    <polyline points="140,150 170,100 200,150 230,100"/>

    <!-- Polygone fermé -->
    <polygon points="280,100 330,150 230,150"/>

    <!-- Chemin : lignes -->
    <path d="M 350,100 L 450,100 L 400,150 Z"/>

    <!-- Chemin : courbe de Bézier quadratique -->
    <path d="M 10,200 Q 60,150 110,200"/>

    <!-- Chemin : courbe de Bézier cubique -->
    <path d="M 140,200 C 160,150 210,250 230,200"/>

    <!-- Chemin : arc elliptique -->
    <path d="M 280,200 A 50,30 0 0 1 380,200"/>

    <!-- Groupe contenant plusieurs formes -->
    <g>
        <rect x="10" y="280" width="60" height="60"/>
        <circle cx="110" cy="310" r="30"/>
        <polygon points="180,280 210,340 150,340"/>
    </g>

</svg>
